  [data-cases-filters]:not(.is-ready),
  [data-title-accent]:not([data-title-accent-ready]) {

    animation: blinked-cloak-v 0s 3s forwards;

  @keyframes blinked-cloak-v {

  .cs_result_row:has(.svc_info_value.w-dyn-bind-empty),
  .cs_result_value.w-dyn-bind-empty,
  .cs_result .svc_card_text.w-dyn-bind-empty,

  @media (prefers-reduced-motion: no-preference) {
    .cs_result,
    .svc_hero_card {
      animation: hero-card-in 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
    }
  }
  @keyframes hero-card-in {
    from {
      opacity: 0;
      translate: 0 2.5rem;
    }
    to {
      opacity: 1;
      translate: 0 0;
    }
  }

  .section_hero:has(.svc_hero_curve) {
    overflow: visible;
    padding-bottom: 7rem;
  }
  @media screen and (max-width: 991px) {
    .section_hero:has(.svc_hero_curve) {
      padding-bottom: 4.5rem;
    }
    .main-wrapper .svc_hero {
      grid-template-columns: 1fr;
    }
    .main-wrapper .svc_hero_title {
      font-size: 3rem;
    }
    .main-wrapper .svc_hero_curve {
      display: none;
    }
  }
  @media screen and (max-width: 767px) {
    .section_hero:has(.svc_hero_curve) {
      padding-bottom: 3rem;
    }
    .main-wrapper .svc_hero_title {
      font-size: 2.5rem;
    }
  }

  .logo3_wrapper {
    min-height: 3.5rem;
    align-items: center;
  }
  @media screen and (max-width: 767px) {
    .logo3_wrapper {
      min-height: 4.5rem;
    }

<script>
  (function () {
    const FORCE_PROD = false;

    const PROJECT = 'blinked';
    const REPO = 'Brand-Appart-Delivery/blinked-webflow-scripts';
    const DEV_ORIGINS = ['http://localhost:3000', 'https://dev.michelaxel.fr'];
    const VERSION_URL = 'https://raw.githubusercontent.com/' + REPO + '/main/version.json';
    const CDN = 'https://cdn.jsdelivr.net/gh/' + REPO + '@';

    const host = window.location.hostname;
    const isStaging = host === 'localhost' || host === '127.0.0.1' || host.endsWith('.webflow.io');

    function getProdVersion() {
      const ctrl = new AbortController();
      const timer = setTimeout(function () { ctrl.abort(); }, 1500);
      return fetch(VERSION_URL + '?t=' + Date.now(), { cache: 'no-store', signal: ctrl.signal })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) { return d && d.version ? d.version : 'main'; })
        .catch(function () { return 'main'; })
        .finally(function () { clearTimeout(timer); });
    }

    async function findDevOrigin() {
      if (FORCE_PROD || !isStaging) return null;
      for (const origin of DEV_ORIGINS) {
        try {
          const r = await fetch(origin + '/package.json', { cache: 'no-store' });
          const pkg = r.ok ? await r.json() : null;
          if (pkg && pkg.name === PROJECT) return origin;
          console.warn('[Blinked] Serveur de dev ignoré (' + origin + ') : projet ' + (pkg && pkg.name));
        } catch (e) {}
      }
      return null;
    }

    window.__blinked = (async function () {
      const dev = await findDevOrigin();
      if (dev) return { base: dev, dev: true };
      const version = await getProdVersion();
      return { base: CDN + version, version: version };
    })();

    window.__blinked.then(function (o) {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = o.base + '/main.css';
      document.head.appendChild(link);
      console.log('[Blinked] CSS :', link.href);
      if (o.dev) {
        try {
          new EventSource(o.base + '/esbuild').addEventListener('change', function () {
            location.reload();
          });
        } catch (e) {}
      }
    });
  })();
</script>
