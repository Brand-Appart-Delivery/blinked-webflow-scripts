<!--
  Webflow → Site settings → Custom code → FOOTER CODE (avant </body>)
  Placer APRÈS les librairies externes (GSAP, ScrollTrigger, Lenis…) :
  main.js les lit sur window.
-->
<script>
  (window.__blinked || Promise.resolve({ base: 'https://cdn.jsdelivr.net/gh/Brand-Appart-Delivery/blinked-webflow-scripts@main' }))
    .then(function (o) {
      const script = document.createElement('script');
      script.src = o.base + '/main.js';
      document.body.appendChild(script);
      console.log('[Blinked] JS :', script.src);
    });
</script>
